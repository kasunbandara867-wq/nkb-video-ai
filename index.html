<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NKB Video AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: #15151f;
            border-radius: 18px;
            padding: 20px;
            border: 1px solid #292938;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #ccc;
        }
        textarea {
            width: 100%;
            height: 120px;
            resize: none;
            border: none;
            outline: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            background: #09090e;
            color: white;
            box-sizing: border-box;
        }
        .options {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        select {
            flex: 1;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #333344;
            background: #09090e;
            color: white;
            font-size: 14px;
            outline: none;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-size: 17px;
            font-weight: bold;
            background: #ffffff;
            color: #000;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        .preview {
            margin-top: 25px;
            height: 250px;
            border-radius: 16px;
            background: #09090e;
            border: 1px dashed #444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            text-align: center;
            padding: 10px;
        }
        h2 {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
            color: #fff;
        }
        .footer {
            text-align: center;
            color: #666;
            margin-top: 30px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>NKB VIDEO AI</h2>
        <label for="prompt">Create your own AI videos</label>
        <textarea id="prompt" placeholder="Describe your video (උදා: A talking brown dog named ටොමියා...)"></textarea>
        
        <div class="options">
            <select>
                <option>9:16 Vertical</option>
                <option>16:9 Horizontal</option>
            </select>
            <select>
                <option>5 seconds</option>
                <option>10 seconds</option>
            </select>
        </div>

        <button>✨ Generate Video</button>
        
        <div class="preview">
            🎬 Video generation will start here...
        </div>
    </div>

    <div class="footer">
        NKB Video AI • Early Prototype
    </div>

</body>
</html>
